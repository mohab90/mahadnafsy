name: CI

# Pull requests use only an isolated disposable MySQL service. They never query
# production. Manual remote smoke testing is protected by the staging environment.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: API lint + quality gate
    runs-on: ubuntu-latest
    # Throwaway database container migrated fresh on every run; it never holds
    # live data. MariaDB 10.11, the engine production runs: MySQL 8 accepted
    # SQL production rejects and rejected SQL production accepts (ALTER … IF
    # NOT EXISTS, REGEXP_SUBSTR, case-insensitive ENUMs), so a green run there
    # said little about a deploy.
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: mahad_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: mahad_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        run: npm --prefix api ci
      - name: Load reference schema (api/schema.sql — structure-only baseline)
        run: mysql -h127.0.0.1 -P3306 -uroot mahad_ci < api/schema.sql
      # runMigrations() baselines 001-033 (pre-runner era) as already-applied
      # without re-executing, then runs every migration schema.sql's dump date
      # hadn't caught up to yet. Those are written idempotently (IF [NOT]
      # EXISTS guards), so this is safe even if some of them already landed
      # in the dump.
      - name: Apply migrations newer than the schema.sql snapshot
        run: npm run migrate
      - name: JavaScript syntax check (all API source and tools)
        run: npm run syntax:api
      - name: ESLint (api — no-undef)
        run: npm run lint:api
      # Unit tests run without the database settings, as they do locally: with
      # DB_* in the environment some suites open a real pool that keeps the
      # process alive, and on 10 Oct 2026 this step sat for six hours until
      # GitHub cancelled the run — so no commit could ever show green CI, which
      # the release gate (deploy/release-all.sh) now requires.
      - name: Unit tests (finance / RBAC / templates / helpers / tenant / pagination)
        timeout-minutes: 20
        shell: bash
        run: set -o pipefail; env -u DB_HOST -u DB_USER -u DB_PASSWORD -u DB_NAME -u DB_PORT npm --prefix api run test:unit 2>&1 | tee "$RUNNER_TEMP/unit.tap"
      # Each file runs on its own copy of a template built from schema.sql and
      # the migrations (api/tests/integration/support/isolatedDb.mjs), dropped
      # when the file ends: mahad_ci stays as migrated for the API below, and
      # no file depends on what another left behind.
      - name: Integration tests (real MariaDB, one throwaway database per file)
        timeout-minutes: 30
        shell: bash
        run: set -o pipefail; npm --prefix api run test:integration 2>&1 | tee "$RUNNER_TEMP/integration.tap"
      # The API as it really runs — server.js, its pool, its limits — for the
      # two checks below and the API E2E specs. Background processes outlive
      # their step in Actions, so it stays up for the rest of the job. A user
      # with a password: server.js refuses to start without DB_PASSWORD, and
      # this container's root has none.
      - name: Start the API (port 3105, for the burst smoke and the API E2E specs)
        shell: bash
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -e "CREATE USER IF NOT EXISTS 'mahad_smoke'@'%' IDENTIFIED BY 'smoke-pass'; GRANT ALL ON mahad_ci.* TO 'mahad_smoke'@'%';"
          DB_USER=mahad_smoke DB_PASSWORD=smoke-pass PORT=3105 \
          JWT_SECRET=ci-smoke-jwt-secret-0123456789abcdef0123456789 \
          RUN_MIGRATIONS_ON_STARTUP=false WA_WEB_DISABLED=1 \
            nohup node api/server.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3105/api/health/live >/dev/null 2>&1 && { echo "API up after ${i}s"; exit 0; }
            sleep 1
          done
          echo "the API did not come up"; tail -n 80 "$RUNNER_TEMP/api.log"; exit 1
      # Forty public lead forms at once held every pool connection on 20 Oct
      # 2026 and the API stopped answering until it was restarted. Fails on any
      # 5xx or timeout, or when /api/health is not ok afterwards.
      - name: Burst smoke (40 public lead forms at once, then /api/health)
        timeout-minutes: 5
        run: API_BASE_URL=http://127.0.0.1:3105 node api/tools/public-burst-smoke.cjs
      # Thousands of TAP lines bury the one that failed; this prints just the
      # failing tests and their errors at the end of a red run.
      - name: Failing tests
        if: failure()
        shell: bash
        run: |
          for f in "$RUNNER_TEMP"/unit.tap "$RUNNER_TEMP"/integration.tap; do
            [ -f "$f" ] && grep -n -A40 -E '^\s*not ok' "$f" | head -400 || true
          done
          [ -f "$RUNNER_TEMP/api.log" ] && tail -n 80 "$RUNNER_TEMP/api.log" || true
      - name: Quality gate
        run: node tools/mahad-quality-check.mjs
      - name: Dependency audit (new advisories fail; expiring risks are explicit)
        run: npm run audit:dependencies
      # From inside e2e/: run from the root, Playwright finds no config, lists
      # zero specs and picks up the API's own *.test.js files instead.
      - name: E2E compile check (Playwright --list)
        working-directory: e2e
        run: |
          npm ci || npm install
          npx playwright test --list
      # The specs that need only the API run against the one started above:
      # the auth boundary on the admin, finance and money endpoints, and the
      # public API checks of the smoke spec. They open no browser; the page
      # specs run in the browser-e2e job below.
      - name: E2E API specs against the started API
        working-directory: e2e
        env:
          API_BASE_URL: http://127.0.0.1:3105
        run: |
          npx playwright test tests/api-contract.spec.ts
          npx playwright test tests/public-smoke.spec.ts --grep "API health"

  migrations-from-empty:
    name: Database built by the migration runner alone
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The job above loads api/schema.sql by hand and then migrates — the path a
    # developer takes. A new server takes the other one: an empty database and
    # `npm run migrate`, nothing else. The runner then bootstraps from its own
    # reference snapshot and replays every migration after 033 against it —
    # including 065's unguarded `DROP INDEX uniq_payroll_run`, which stopped
    # every migration after it until the runner learned to treat a drop of an
    # index that is already gone as done (lib/migrationRunner.js). 065 itself
    # cannot be edited: production recorded its checksum, and migrate:verify
    # would report the edited file as tampered with.
    #
    # Literally "migrations only" is not possible: 001-033 predate the runner
    # and ALTER tables (courses, leads, …) that the old boot-time DDL created,
    # so the reference snapshot is the floor every database is built from.
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: mahad_fresh
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: mahad_fresh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        run: npm --prefix api ci
      - name: Migrate an empty database (no schema.sql loaded by hand)
        run: npm run migrate
      - name: A second run changes nothing
        run: npm run migrate 2>&1 | tee second-run.log && grep -q 'applied=0 failed=0' second-run.log
      - name: The newest applied migration is the newest file shipped
        run: |
          want=$(ls api/migrations | grep -E '^[0-9]+.*\.sql$' | LC_ALL=C sort | tail -1)
          got=$(mysql -h127.0.0.1 -P3306 -uroot -N -B mahad_fresh -e 'SELECT version FROM schema_migrations ORDER BY version DESC LIMIT 1')
          echo "shipped: $want  applied: $got"
          test "$want" = "$got"
          mysql -h127.0.0.1 -P3306 -uroot -N -B mahad_fresh -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema='mahad_fresh' AND table_name='payroll_runs' AND index_name='uniq_payroll_run_scope'" | grep -qv '^0$'

  browser-e2e:
    name: Browser E2E (built site + admin on a seeded API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The site and the admin as built for production, served by vite preview
    # with /api proxied to the real API on a fresh database, and driven by
    # Chromium: the public pages, a course page, checkout up to the hand-off to
    # Paymob (the call that would reach Paymob is answered by the spec), a paid
    # student opening a paid lecture, and an administrator's leads list. The
    # rows come from api/tools/e2e-seed.cjs. Built here rather than taken from
    # the admin and client jobs so this job starts at once instead of after
    # them; the two builds run side by side.
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: mahad_e2e_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: mahad_e2e_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            admin/package-lock.json
            client/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies (api, client, admin, e2e)
        run: |
          npm --prefix api ci
          npm --prefix client ci
          npm --prefix admin ci
          npm --prefix e2e ci
      - name: Build the site and the admin
        shell: bash
        run: |
          npm --prefix client run build > "$RUNNER_TEMP/client-build.log" 2>&1 & client=$!
          npm --prefix admin run build > "$RUNNER_TEMP/admin-build.log" 2>&1 & admin=$!
          wait $client || { tail -n 60 "$RUNNER_TEMP/client-build.log"; exit 1; }
          wait $admin || { tail -n 60 "$RUNNER_TEMP/admin-build.log"; exit 1; }
      - name: Chromium for Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Migrate an empty database and seed the E2E rows
        run: |
          npm run migrate
          node api/tools/e2e-seed.cjs
      # server.js refuses to start without DB_PASSWORD, and this container's
      # root has none. Two customer devices is the product's limit
      # (lib/customerDevices.js), and three distinct devices a day lock an
      # account for sharing (lib/accountSharingGuard.js); every Playwright test
      # is a new browser.
      - name: Start the API (3105), the site (3000) and the admin (4000)
        shell: bash
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -e "CREATE USER IF NOT EXISTS 'mahad_e2e'@'%' IDENTIFIED BY 'e2e-pass'; GRANT ALL ON mahad_e2e_ci.* TO 'mahad_e2e'@'%';"
          DB_USER=mahad_e2e DB_PASSWORD=e2e-pass PORT=3105 \
          JWT_SECRET=ci-e2e-jwt-secret-0123456789abcdef0123456789 \
          RUN_MIGRATIONS_ON_STARTUP=false WA_WEB_DISABLED=1 CUSTOMER_MAX_DEVICES=50 ACCOUNT_MAX_DISTINCT_DEVICES=50 \
            nohup node api/server.js > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd client && VITE_API_PROXY_TARGET=http://127.0.0.1:3105 nohup npx vite preview --host 127.0.0.1 --port 3000 --strictPort > "$RUNNER_TEMP/client.log" 2>&1 &)
          (cd admin && VITE_API_PROXY_TARGET=http://127.0.0.1:3105 nohup npx vite preview --host 127.0.0.1 --port 4000 --strictPort > "$RUNNER_TEMP/admin.log" 2>&1 &)
          for url in http://127.0.0.1:3105/api/health/live http://127.0.0.1:3000/api/health/live http://127.0.0.1:4000/; do
            for i in $(seq 1 60); do curl -fsS "$url" >/dev/null 2>&1 && break; sleep 1; done
            curl -fsS "$url" >/dev/null || { echo "$url did not come up"; tail -n 60 "$RUNNER_TEMP"/*.log; exit 1; }
          done
      - name: Page specs (public smoke, course, checkout, student lecture, admin leads)
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:3000
          ADMIN_BASE_URL: http://127.0.0.1:4000
          API_BASE_URL: http://127.0.0.1:3105
          E2E_SEEDED: '1'
        run: npx playwright test tests/public-smoke.spec.ts tests/admin-login.spec.ts tests/payment-flow.spec.ts tests/ci-journeys.spec.ts
      - name: Server logs
        if: failure()
        shell: bash
        run: tail -n 80 "$RUNNER_TEMP"/api.log "$RUNNER_TEMP"/client.log "$RUNNER_TEMP"/admin.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ github.sha }}
          path: e2e/test-results/
          retention-days: 7

  admin:
    name: Admin — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Build (vite)
        run: npm run build

  client:
    name: Client — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Build (vite)
        run: npm run build

  release-artifact:
    name: Immutable release artifacts
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: [static-checks, browser-e2e, admin, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            admin/package-lock.json
            client/package-lock.json
      - name: Build reviewed frontend assets
        run: |
          npm --prefix admin ci
          npm --prefix client ci
          npm --prefix admin run build
          npm --prefix client run build
      - name: Build commit-addressed API/Admin/Client artifacts and SHA-256 manifest
        env:
          APP_RELEASE: mahad-${{ github.sha }}
        run: npm run release:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: mahad-release-${{ github.sha }}
          path: artifacts/releases/*
          if-no-files-found: error
          retention-days: 14
