name: CI

# Static safety net — runs on every push/PR. No database required: these checks
# (type-check, build, lint, quality gate) are all offline. The DB-backed smoke
# test lives in smoke.yml (self-hosted) because it needs the live SSH-tunnelled DB.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: API lint + quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ESLint (api — no-undef)
        run: npm run lint:api
      - name: Unit tests (finance / RBAC / templates / helpers)
        run: npm --prefix api run test:unit
      - name: Quality gate (48 checks)
        run: node tools/mahad-quality-check.mjs

  admin:
    name: Admin — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Build (vite)
        run: npm run build

  client:
    name: Client — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Build (vite)
        run: npm run build
