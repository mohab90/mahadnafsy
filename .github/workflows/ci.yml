name: CI

# Static safety net — runs on every push/PR. No database required: these checks
# (type-check, build, lint, quality gate) are all offline. The DB-backed smoke
# test lives in smoke.yml (self-hosted) because it needs the live SSH-tunnelled DB.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: API lint + quality gate
    runs-on: ubuntu-latest
    # Ephemeral test database (TEST-04) — separate from smoke.yml's self-hosted
    # job, which SSH-tunnels into the real production DB for a live smoke test.
    # This one is a throwaway MySQL container: migrated fresh on every run, never
    # holds real data, exists only so tests/integration/*.test.js (schema/ledger
    # invariant checks) run in CI instead of skipping silently everywhere.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: mahad_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: mahad_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        run: npm --prefix api ci
      - name: Load reference schema (api/schema.sql — structure-only baseline)
        run: mysql -h127.0.0.1 -P3306 -uroot mahad_ci < api/schema.sql
      # runMigrations() baselines 001-033 (pre-runner era) as already-applied
      # without re-executing, then runs every migration schema.sql's dump date
      # hadn't caught up to yet. Those are written idempotently (IF [NOT]
      # EXISTS guards), so this is safe even if some of them already landed
      # in the dump.
      - name: Apply migrations newer than the schema.sql snapshot
        run: npm run migrate
      - name: ESLint (api — no-undef)
        run: npm run lint:api
      - name: Unit tests (finance / RBAC / templates / helpers / tenant / pagination)
        run: npm --prefix api run test:unit
      - name: Integration tests (real MySQL — schema/ledger invariants)
        run: npm --prefix api run test:integration
      - name: Quality gate (54 checks)
        run: node tools/mahad-quality-check.mjs
      - name: Dependency audit (api / admin / client)
        run: |
          npm --prefix api    audit --omit=dev --audit-level=high
          npm --prefix admin  audit --audit-level=moderate
          npm --prefix client audit --audit-level=moderate
      - name: E2E compile check (Playwright --list)
        run: |
          npm --prefix e2e ci || npm --prefix e2e install
          npm --prefix e2e exec -- playwright test --list

  admin:
    name: Admin — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Build (vite)
        run: npm run build

  client:
    name: Client — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Build (vite)
        run: npm run build
