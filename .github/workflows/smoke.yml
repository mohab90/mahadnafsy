name: Smoke (staging only)

# Manual verification is restricted to the protected staging environment.
# Never point this workflow at production.
on:
  workflow_dispatch:
    inputs:
      staging_api_url:
        description: 'HTTPS staging origin (for example https://staging.example.com)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Staging API smoke test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only and validation smoke against staging
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.staging_api_url }}
        run: node tools/mahad-api-smoke.mjs
