# Security headers for the public site and the admin (22 Oct 2026).
#
# Install once on the server:
#   sudo cp mahad-security-headers.conf /etc/nginx/snippets/mahad-security-headers.conf
# and `include snippets/mahad-security-headers.conf;` in EVERY location that has
# its own add_header (nginx drops the server-level add_header lines in any
# location that sets one of its own), as mahad-web.conf.example does. Then
# `sudo nginx -t && sudo systemctl reload nginx`.
#
# What is enforced is what cannot break a page: HTTPS-only for a year, no MIME
# sniffing, no framing by other sites (clickjacking), a referrer that stops at
# the origin, and no plugins or <base> rewriting. The Paymob checkout is a
# top-level redirect, not a frame, so frame-ancestors does not touch it.
#
# The full Content-Security-Policy is REPORT-ONLY: browsers report what it would
# block to /api/security/csp-report (logged by the API as «[csp] would block»)
# and block nothing. The pages have inline scripts (the analytics bootstrap in
# client/index.html), Google Analytics / Meta Pixel, YouTube / Vimeo / Drive
# embeds and images from many hosts; after a week of clean logs, the same value
# can be moved to Content-Security-Policy to enforce it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: https:; connect-src 'self' wss: https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://connect.facebook.net https://www.facebook.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://drive.google.com https://www.facebook.com https://accept.paymob.com; form-action 'self' https://accept.paymob.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; report-uri /api/security/csp-report" always;
