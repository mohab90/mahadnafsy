<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MahadNafsy System</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Same reason as the customer site: an empty root meant the panel opened
         as a white page until React painted, which reads as a failed login. -->
    <div id="root">
      <div id="app-boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff;font-family:system-ui,'Segoe UI',Tahoma,sans-serif" dir="rtl">
        <div style="width:38px;height:38px;border:3px solid #e5e7eb;border-top-color:#4f46e5;border-radius:50%;animation:mahad-spin .7s linear infinite"></div>
        <p style="margin:0;color:#6b7280;font-size:14px;font-weight:700">جارٍ تحميل لوحة التحكم...</p>
      </div>
    </div>
    <style>@keyframes mahad-spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
