<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- The institute mark from client/public/favicon.svg, on a dark ground.
       The admin had no icon at all, so its tab showed the browser default and
       adding it to a phone home screen produced a blank placeholder. Same
       figure as the public site so it reads as the same institute; inverted
       colours so a staff member with both open can tell the tabs apart. -->
  <rect width="200" height="200" rx="44" fill="#0F172A"/>
  <!-- Body/arm raised -->
  <path d="M100 155 Q78 130 72 105 Q66 80 85 68 Q95 62 100 65 Q105 62 115 68 Q134 80 128 105 Q122 130 100 155Z" fill="#C0121B"/>
  <!-- Head -->
  <circle cx="100" cy="58" r="18" fill="#C0121B"/>
  <!-- Graduation cap -->
  <polygon points="100,28 135,42 100,56 65,42" fill="#C0121B"/>
  <rect x="127" y="41" width="4" height="18" fill="#C0121B"/>
  <rect x="123" y="57" width="12" height="5" rx="2" fill="#C0121B"/>
</svg>
